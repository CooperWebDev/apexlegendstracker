    <select id="cbp" aria-label="Second platform"><option value="PC">PC</option><option value="PS4">PlayStation</option><option value="X1">Xbox</option></select>
    <button type="submit">Compare</button>
  </form>
  <div id="cmsg" role="status"></div>
  <div id="cout" style="margin-top:24px"></div>
